# Publishes to npm via trusted publishing (OIDC) when a GitHub release is created.
# The filename (npm-publish.yml) must match the workflow configured on npmjs.com.

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm publish
